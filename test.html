<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <!-- 모바일 뷰포트 설정 필수 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Frame Clip Test</title>
  <style>
    /* body 기본 여백 제거 */
    body {
      margin: 0;
      padding: 0;
    }

    .frame-window {
      width: 880px;      /* 보여줄 영역 크기 */
      height: 496px;
      overflow: hidden;
      position: relative;
      border: 1px solid #000;
      
      /* iOS Safari 하드웨어 가속 및 레이어 정상 생성 유도 */
      -webkit-overflow-scrolling: touch;
      transform: translateZ(0);
      -webkit-transform: translateZ(0);
    }

    .frame-window iframe {
      position: absolute;
      width: 1440px;     /* 실제 페이지 렌더 크기 */
      height: 9000px;    /* iOS 렌더링 한계를 고려해 높이를 현실적으로 축소 */
      border: none;
      left: -280px;      /* 보고 싶은 지점의 x 좌표 */
      top:  -7509px;      /* y 좌표 만큼 음수 -871px + (-552 x n) */
    }
  </style>
</head>
<body>

  <div class="frame-window">
    <iframe src="https://blog.naver.com/htmp00/224373394599" scrolling="no"></iframe>
  </div>

</body>
</html>
